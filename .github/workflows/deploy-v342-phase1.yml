name: Deploy Atlas v3.4.2 consolidated Stage 1 Worker (one-time)
on:
  push:
    branches: [feature/v342-stability-skill-proficiency]
    paths:
      - '.github/workflows/deploy-v342-phase1.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Type DEPLOY for production; otherwise only validate'
        required: true
        default: 'DRY_RUN'
permissions:
  contents: read
concurrency:
  group: dndatlas-production-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax, role controls and D&D 2024
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check workers/production/history-drive-extension.js
          node --test tests/rules-2024.test.cjs tests/history-drive-extension.test.cjs tests/stability-v340.test.cjs
      - name: Install isolated D1 test runtime
        run: npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund miniflare@4.20260730.0
      - name: Verify production Worker and generate exact additive patch
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -o /tmp/atlas-production-before.raw \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/dndatlas-api"
          git show origin/main:workers/production/history-drive-extension.js > /tmp/atlas-extension-before.js
          python3 workers/production/patch-v342-phase1.py \
            /tmp/atlas-production-before.raw \
            /tmp/atlas-extension-before.js \
            workers/production/history-drive-extension.js \
            .atlas-staging-worker.mjs
          node --check .atlas-staging-worker.mjs
      - name: Run integration suite against exact proposed Worker and disposable local D1
        env:
          ATLAS_WORKER_SOURCE: .atlas-staging-worker.mjs
        run: node --test tests/staging-d1-integration.test.cjs
      - name: Deploy Worker module only (D1 binding and secrets unchanged)
        if: github.event_name == 'push' || inputs.deploy == 'DEPLOY'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            -o /tmp/atlas-v342-deploy.json -X PUT \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -F 'metadata={"main_module":"index.js"};type=application/json' \
            -F 'index.js=@.atlas-staging-worker.mjs;filename=index.js;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/dndatlas-api/content"
          python3 - <<'PY'
          import json
          result=json.load(open('/tmp/atlas-v342-deploy.json'))
          if not result.get('success'):raise SystemExit('Cloudflare did not confirm deployment')
          print('Cloudflare production Worker update confirmed')
          PY
      - name: Read back production Worker and verify byte-for-byte and /health
        if: github.event_name == 'push' || inputs.deploy == 'DEPLOY'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -o /tmp/atlas-production-after.raw \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/dndatlas-api"
          python3 - <<'PY'
          from importlib.machinery import SourceFileLoader
          import hashlib
          parser=SourceFileLoader('patcher','workers/production/patch-v342-phase1.py').load_module()
          actual=parser.extract(open('/tmp/atlas-production-after.raw','rb').read())
          expected=open('.atlas-staging-worker.mjs','rb').read()
          if actual!=expected:raise SystemExit('Published Worker differs from SHA-verified patch')
          print('Verified production SHA256:',hashlib.sha256(actual).hexdigest())
          PY
          curl --silent --show-error --fail -o /tmp/atlas-health.json \
            "https://dndatlas-api.pagkalosgeo.workers.dev/health"
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/atlas-health.json')).get('status')=='ok'
          print('Production health: OK')
          PY
