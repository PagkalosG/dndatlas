name: Validate D&D Atlas changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          for js in src/*.js; do node --check "$js"; done
      - name: 2024 rules tests
        run: node --test tests/rules-2024.test.cjs
