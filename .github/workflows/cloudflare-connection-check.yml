name: Cloudflare staging connection check

on:
  push:
    branches:
      - atlas-2.0
    paths:
      - .github/workflows/cloudflare-connection-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cloudflare:
    name: Verify Cloudflare staging credentials (read-only)
    if: github.repository == 'PagkalosG/dndatlas' && github.ref == 'refs/heads/atlas-2.0'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check that environment secrets exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN in the staging environment."
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::Missing or malformed CLOUDFLARE_ACCOUNT_ID in the staging environment."
            exit 1
          fi
          echo "Both staging secrets are present."

      - name: Verify Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error --retry 2             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             --header "Accept: application/json"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")"
          if ! jq -e '.success == true and .result.status == "active"' <<< "${result}" >/dev/null; then
            echo "::error::Cloudflare token is not active."
            exit 1
          fi
          echo "Cloudflare API token is active."

      - name: Verify D1 access for selected Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          # Read-only request. Does not create any database or worker.
          result="$(curl --fail --silent --show-error --retry 2             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             --header "Accept: application/json"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=1")"
          if ! jq -e '.success == true and (.result | type == "array")' <<< "${result}" >/dev/null; then
            echo "::error::D1 listing failed for this account."
            exit 1
          fi
          echo "D1 account access is working. No resources were changed."
