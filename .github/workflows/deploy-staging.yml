name: Validate and deploy staging API
on:
  push:
    branches: [staging]
permissions:
  contents: read
concurrency:
  group: atlas-staging-api
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression checks
        run: |
          set -euo pipefail
          node --check workers/staging/worker.mjs
          node --check workers/staging/entry.mjs
          node --check src/app.js
          node --check src/data.js
          node --check src/rules-2024.js
          node --test tests/rules-2024.test.cjs tests/history-drive-extension.test.cjs tests/stability-v340.test.cjs tests/ui-skill-stat-controls-v343.test.cjs tests/quality-v350.test.cjs
      - name: Check content pack, spell audit and DM review regressions
        run: node --test tests/content-packs.test.cjs tests/content-packs-bridge.test.cjs tests/spell-source-audit.test.cjs tests/dm-rules-review.test.cjs
      - name: Check staging isolation before accessing deployment credentials
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import api from './workers/staging/entry.mjs';
          const base='https://dndatlas-api-staging.pagkalosgeo.workers.dev';
          const db={prepare(sql){assert.equal(sql,'SELECT 1 FROM users LIMIT 1');return {first:async()=>null};}};
          assert.equal((await api.fetch(new Request('https://dndatlas-api.pagkalosgeo.workers.dev/health'),{DB:db})).status,403);
          assert.equal((await api.fetch(new Request(base+'/health'),{})).status,503);
          assert.deepEqual(await (await api.fetch(new Request(base+'/health'),{DB:db})).json(),{status:'ok',environment:'staging',database:'ready'});
          assert.equal((await api.fetch(new Request(base+'/characters'),{DB:db,ALLOWED_ORIGIN:'https://pagkalosg.github.io'})).status,503);
          assert.equal((await api.fetch(new Request(base+'/characters'),{DB:db})).status,503);
          assert.equal((await api.fetch(new Request(base+'/characters'),{DB:db,ALLOWED_ORIGIN:'https://atlas-test.invalid'})).status,401);
          assert.equal((await api.fetch(new Request(base+'/characters',{headers:{Origin:'https://pagkalosg.github.io'}}),{DB:db,ALLOWED_ORIGIN:'https://atlas-test.invalid'})).status,403);
          console.log('Staging isolation checks passed');
          JS
      - name: Install isolated D1 test runtime
        run: npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund miniflare@4.20260730.0 playwright@1.56.1
      - name: Test Worker against local D1 only
        env:
          ATLAS_WORKER_SOURCE: workers/staging/worker.mjs
        run: node --test tests/staging-d1-integration.test.cjs
      - name: Assemble isolated staging frontend
        env:
          CF_PAGES_BRANCH: staging
        run: node scripts/build-staging.cjs
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Test roles and manual save in real browser against disposable D1
        run: node --test tests/staging-browser.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-staging-frontend
          path: _staging_site/
          if-no-files-found: error
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging binding and deploy code only
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/staging
          [[ "$CF_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Missing or invalid staging account ID'; exit 1; }
          test -n "$CF_API_TOKEN" || { echo 'Missing staging token'; exit 1; }
          [[ "$STAGING_D1_DATABASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo 'Set staging environment variable STAGING_D1_DATABASE_ID'; exit 1; }
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/dndatlas-api-staging"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          verify_binding() {
            curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" "$endpoint/settings" -o "$tmp/settings.json"
            jq -e --arg id "$STAGING_D1_DATABASE_ID" '.success == true and ([.result.bindings[] | select(.type == "d1")] | length == 1) and any(.result.bindings[]; .name == "DB" and .type == "d1" and (.database_id // .id) == $id)' "$tmp/settings.json" >/dev/null || { echo 'Refusing deployment: DB does not match the explicitly approved staging database'; exit 1; }
          }
          verify_binding
          curl -fsS -X PUT -H "Authorization: Bearer $CF_API_TOKEN" \
            -F 'metadata={"main_module":"entry.mjs"};type=application/json' \
            -F 'entry.mjs=@workers/staging/entry.mjs;type=application/javascript+module' \
            -F 'worker.mjs=@workers/staging/worker.mjs;type=application/javascript+module' \
            "$endpoint/content" -o "$tmp/deploy.json"
          jq -e '.success == true' "$tmp/deploy.json" >/dev/null
          verify_binding
          echo 'Staging Worker code deployed; bindings retained.'
      - name: Check isolated API health
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for attempt in $(seq 1 12); do
            if http=$(curl -sS --max-time 15 -H 'Cache-Control: no-cache' -o "$tmp/health" -w '%{http_code}' "https://dndatlas-api-staging.pagkalosgeo.workers.dev/health?check=$GITHUB_SHA-$attempt"); then
              if [ "$http" = 200 ] && jq -e '.status == "ok" and .environment == "staging" and .database == "ready"' "$tmp/health" >/dev/null 2>&1; then
                echo 'Staging Worker and D1 health verified.'
                exit 0
              fi
              if grep -Fiq 'Hello World' "$tmp/health"; then
                echo "Health attempt $attempt: HTTP $http; previous Hello World response"
              elif jq -e 'type == "object"' "$tmp/health" >/dev/null 2>&1; then
                echo "Health attempt $attempt: HTTP $http; JSON did not match staging health contract"
              else
                echo "Health attempt $attempt: HTTP $http; non-JSON response"
              fi
            else
              echo "Health attempt $attempt: network request failed"
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo '::error::Worker upload succeeded but the public staging URL did not serve the expected health response. Check active deployment in Cloudflare.'
          exit 1
  live-smoke:
    needs: deploy
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify live staging sign-in and role UI without character writes
        env:
          STAGING_CREATOR_PIN: ${{ secrets.STAGING_CREATOR_PIN }}
          STAGING_DM_PIN: ${{ secrets.STAGING_DM_PIN }}
          STAGING_PLAYER_PIN: ${{ secrets.STAGING_PLAYER_PIN }}
        run: node tests/staging-live-smoke.cjs
