name: Deploy D&D Atlas to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/rules-2024.js
          node --test tests/rules-2024.test.cjs
          node --test tests/history-drive-extension.test.cjs
          node --test tests/stability-v340.test.cjs
          node --test tests/ui-skill-stat-controls-v343.test.cjs
          node --test tests/quality-v350.test.cjs
          node --check workers/production/history-drive-extension.js
          node --check src/data.js
          node --check src/i18n.js
          node --check src/pdf-export.js
          node --check src/spell-effects.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare local Cloudflare D1 integration environment
        run: npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund miniflare@4.20260730.0
      - name: Verify published Cloudflare Worker and run role/privacy/backup integration suite
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          ATLAS_WORKER_SOURCE: .atlas-staging-worker.mjs
        run: |
          set -euo pipefail
          umask 077
          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -o /tmp/atlas-published-worker.raw \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/dndatlas-api"
          python3 workers/production/patch-v3100-encounter.py /tmp/atlas-published-worker.raw workers/production/encounter-extension.js .atlas-staging-worker.mjs
          node --check .atlas-staging-worker.mjs
          node --test tests/staging-d1-integration.test.cjs
          python3 - <<'PY'
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          parser=SourceFileLoader('phase1','workers/production/patch-v342-phase1.py').load_module()
          original=parser.extract(Path('/tmp/atlas-published-worker.raw').read_bytes())
          Path('/tmp/atlas-needs-deploy').write_text('yes' if original!=Path('.atlas-staging-worker.mjs').read_bytes() else 'no')
          PY
          if [ "$(cat /tmp/atlas-needs-deploy)" = yes ]; then
            curl --silent --show-error --fail -o /tmp/atlas-encounter-deploy.json -X PUT \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -F 'metadata={"main_module":"index.js"};type=application/json' \
              -F 'index.js=@.atlas-staging-worker.mjs;filename=index.js;type=application/javascript+module' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/dndatlas-api/content"
            python3 -c 'import json; assert json.load(open("/tmp/atlas-encounter-deploy.json"))["success"]'
          fi
          curl --silent --show-error --fail -H "Authorization: Bearer ${CF_API_TOKEN}" -o /tmp/atlas-worker-after.raw "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/dndatlas-api"
          python3 - <<'PY'
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          parser=SourceFileLoader('phase1','workers/production/patch-v342-phase1.py').load_module()
          assert parser.extract(Path('/tmp/atlas-worker-after.raw').read_bytes())==Path('.atlas-staging-worker.mjs').read_bytes()
          PY
      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a public/. _site/
          cp -a src/. _site/
          cp -a data _site/data
          mkdir -p _site/assets
          cp -a assets/campaign _site/assets/campaign
          cp -a assets/icons/. _site/
          cp assets/official-2024-character-sheet.pdf _site/official-2024-character-sheet.pdf
          cp docs/SRD_ATTRIBUTION.md _site/SRD_ATTRIBUTION.md
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/app.js && test -f _site/sw.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact indexing
        run: sleep 20
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4