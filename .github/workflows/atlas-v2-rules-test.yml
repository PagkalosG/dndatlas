name: Validate D&D Atlas 2.0 Rules Core

on:
  push:
    branches: [atlas-2.0]
    paths:
      - 'packages/rules-engine/**'
      - 'tests/core-2024.test.mjs'
      - '.github/workflows/atlas-v2-rules-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-core:
    if: github.repository == 'PagkalosG/dndatlas' && github.ref == 'refs/heads/atlas-2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and behavior tests for 2024 rules core
        run: |
          node --check packages/rules-engine/core-2024.mjs
          node --test tests/core-2024.test.mjs
