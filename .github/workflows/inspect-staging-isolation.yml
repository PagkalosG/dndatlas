name: Inspect Atlas staging isolation (read only)
on:
  push:
    branches: [feature/v342-stability-skill-proficiency]
    paths:
      - '.github/workflows/inspect-staging-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare Worker binding NAMES with D1 listing; never print credentials or UUIDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          for name in dndatlas-api-staging dndatlas-api; do
            status=$(curl --silent --show-error -o "/tmp/${name}-settings.json" -w '%{http_code}' -H "Authorization: Bearer ${CF_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${name}/settings")
            WORKER_NAME="${name}" HTTP_STATUS="${status}" python3 - <<'PY'
          import json,os
          name=os.environ['WORKER_NAME']
          code=os.environ['HTTP_STATUS']
          print('Worker name:',name,'Settings available:',code=='200')
          if code=='200':
            result=json.load(open('/tmp/'+name+'-settings.json')).get('result') or {}
            print('Binding names and types only:',[(x.get('name'),x.get('type')) for x in result.get('bindings',[])])
          PY
          done
          status=$(curl --silent --show-error -o /tmp/staging-db-list.json -w '%{http_code}' -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database")
          HTTP_STATUS="${status}" python3 - <<'PY'
          import json,os
          status=os.environ['HTTP_STATUS']
          print('D1 listing API available:',status=='200')
          if status=='200':
            info=json.load(open('/tmp/staging-db-list.json')).get('result') or []
            print('Database NAMES only:',[x.get('name') for x in info])
          PY
