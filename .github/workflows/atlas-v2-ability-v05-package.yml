name: Package D&D Atlas v0.5 Ability Score changes

on:
  push:
    branches: [atlas-2.0]
    paths: ['.github/workflows/atlas-v2-ability-v05-package.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'PagkalosG/dndatlas' && github.ref == 'refs/heads/atlas-2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build changed-files ZIP from committed branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          files = [
            'apps/web-v2/app.js',
            'apps/web-v2/data.js',
            'apps/web-v2/index.html',
            'apps/web-v2/styles.css',
            'apps/web-v2/README.md',
            'apps/web-v2/components/ability-allocation.js',
            'tests/web-v2-ability-allocation.test.cjs',
            '.github/workflows/atlas-v2-ui-concept-test.yml',
            '.github/workflows/atlas-v2-ui-preview-deploy.yml'
          ]
          with zipfile.ZipFile('DND_Atlas_2_Ability_Allocation_v0.5_Changed_Files.zip','w',zipfile.ZIP_DEFLATED) as z:
            for file in files:
              assert Path(file).is_file(), file
              z.write(file,arcname=file)
          print('Packed exactly',len(files),'committed changed files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DND_Atlas_2_Ability_Allocation_v0.5_Changed_Files
          path: DND_Atlas_2_Ability_Allocation_v0.5_Changed_Files.zip
          if-no-files-found: error
          retention-days: 30
