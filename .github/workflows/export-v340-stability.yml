name: Export D&D Atlas v3.4.0 stability changed files ZIP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v340-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend, Worker, privacy and stability tests
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check workers/production/history-drive-extension.js
          node --test tests/history-drive-extension.test.cjs
          node --test tests/stability-v340.test.cjs
      - name: Package only updated files
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile,ZIP_DEFLATED
          from pathlib import Path
          paths=[
            'src/app.js',
            'workers/production/history-drive-extension.js',
            'workers/production/patch-v340-revisions.py',
            'tests/history-drive-extension.test.cjs',
            'tests/stability-v340.test.cjs',
            'docs/STABILITY_V340.md',
            'public/index.html',
            'public/sw.js',
            'public/version.json',
            '.github/workflows/deploy.yml',
            '.github/workflows/deploy-v340-revisions.yml',
            '.github/workflows/export-v340-stability.yml'
          ]
          archive='dndatlas-v3.4.0-stability-changes.zip'
          with ZipFile(archive,'w',ZIP_DEFLATED) as z:
            for path in paths:
              if not Path(path).is_file():raise SystemExit('Missing file '+path)
              z.write(path,path)
          print('ZIP packaged:',len(paths),'changed files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dndatlas-v3.4.0-stability-changes
          path: dndatlas-v3.4.0-stability-changes.zip
          if-no-files-found: error
          retention-days: 30
