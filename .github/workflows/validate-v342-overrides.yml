name: Verify v3.4.2 sheet overrides against isolated D1
on:
  push:
    branches: [feature/v342-stability-skill-proficiency]
    paths:
      - '.github/workflows/validate-v342-overrides.yml'
      - 'workers/production/history-drive-extension.js'
      - 'workers/production/patch-v342-phase1.py'
      - 'src/app.js'
      - 'tests/staging-d1-integration.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax + D&D rules + regression tests
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check workers/production/history-drive-extension.js
          node --test tests/rules-2024.test.cjs tests/history-drive-extension.test.cjs tests/stability-v340.test.cjs
      - name: Setup local Cloudflare D1 (isolated)
        run: npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund miniflare@4.20260730.0
      - name: Verify production Worker SHA and create patched test Worker
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          curl --silent --show-error --fail -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -o /tmp/atlas-prod.raw \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/dndatlas-api"
          git show origin/main:workers/production/history-drive-extension.js > /tmp/atlas-old-extension.js
          python3 workers/production/patch-v342-phase1.py \
            /tmp/atlas-prod.raw /tmp/atlas-old-extension.js \
            workers/production/history-drive-extension.js .atlas-staging-worker.mjs
          node --check .atlas-staging-worker.mjs
      - name: Run actual Worker with fake Creator, DM and Player accounts against local D1
        env:
          ATLAS_WORKER_SOURCE: .atlas-staging-worker.mjs
        run: node --test tests/staging-d1-integration.test.cjs
