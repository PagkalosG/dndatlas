name: One-time Atlas legacy branch cleanup
on:
  push:
    branches:
      - atlas-2.0
    paths:
      - .github/workflows/atlas-branch-cleanup.yml
permissions:
  contents: write
jobs:
  delete-legacy-branches:
    if: github.repository == 'PagkalosG/dndatlas' && github.ref == 'refs/heads/atlas-2.0'
    runs-on: ubuntu-latest
    steps:
      - name: Verify backup branch and delete exact legacy refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          expected_main="0eb0697b760c3e4986f438958f79392477284604"
          actual_main="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${actual_main}" != "${expected_main}" ]]; then
            echo "Main changed after the backup; refusing to delete any branches."
            exit 1
          fi
          branches=(
            'backup/pre-multiparty-v3.3.1'
            'feat/drive-json-mirror-live-sync-v331'
            'feat/party-backup-replace-and-pending-choices'
            'feature/import-single-character-v327'
            'feature/inventory-canon-2024-v325'
            'feature/multi-party'
            'feature/v3.3-atlas-workflows'
            'fix/mastery-effects-gror-v326'
            'fix/organized-v3.2.3-pages'
            'fix/restore-single-character-import-v328'
            'restructure-v3.2.3'
            'staging'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
          done
          echo 'Remaining branches:'
          gh api "repos/${GH_REPO}/git/matching-refs/heads" --jq '.[].ref'
