<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="D&D Atlas 2.0 — a bilingual, interactive UI concept for 2024 character creation.">
  <title>D&D Atlas 2.0 · UI Concept</title>
  <link rel="icon" href="assets/atlas-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><img src="assets/atlas-mark.svg" alt="" width="42" height="42"><span><b>D&D ATLAS</b><small>THE CELESTIAL EDITION</small></span></div>
      <div class="campaign-context"><div class="context-orb" aria-hidden="true">✦</div><div><span class="eyebrow" data-i18n="activeCampaign">ACTIVE CAMPAIGN</span><strong>Echoes of Aether</strong><small data-i18n="campaignSubtitle">D&D 5e · 2024</small></div></div>
      <nav id="primary-nav" class="nav-stack" aria-label="Main"></nav>
      <div class="sidebar-footer"><span class="mock-dot"></span><span data-i18n="mockNotice">INTERACTIVE PROTOTYPE · NO BACKEND</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left"><div class="breadcrumbs"><span data-i18n="campaignLabel">Campaign</span><span class="chevron">/</span><strong id="current-view-label">Character Builder</strong></div></div>
        <div class="topbar-actions">
          <label class="language-control" for="lang-select"><span data-i18n="language">Language</span><select id="lang-select" aria-label="Language"><option value="en">English</option><option value="el">Ελληνικά</option></select></label>
          <span class="role-pill" id="role-pill">PLAYER</span>
          <div class="user-avatar" aria-label="Demo account">G</div>
        </div>
      </header>
      <main id="main" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
